<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IFC Viewer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Toolbar -->
      <div id="toolbar">
        <div class="toolbar-group">
          <label id="load-btn" class="toolbar-btn" title="Загрузить IFC-файл">
            <input type="file" id="file-input" accept=".ifc" hidden />
            📂 Загрузить IFC
          </label>
          <button id="sample-btn" class="toolbar-btn" title="Загрузить тестовую IFC модель">📦 Пример модели</button>
          <button id="fit-btn" class="toolbar-btn" title="Показать всю модель">🔍 Вписать</button>
          <button id="section-btn" class="toolbar-btn" title="Куб подрезки 3D (Section Box)">✂️ Подрезка</button>
          <button id="tree-btn" class="toolbar-btn" title="Дерево элементов и видимость категорий">🌲 Дерево</button>
          <button id="unhide-all-btn" class="toolbar-btn hidden" title="Показать все скрытые элементы">👁️ Показать всё (<span id="hidden-count">0</span>)</button>
          <button id="wireframe-btn" class="toolbar-btn" title="Переключить каркасный режим">🔲 Каркас</button>
          <button id="ortho-btn" class="toolbar-btn" title="Переключить проекцию">📐 Орто</button>
        </div>
        <div class="toolbar-group">
          <span id="status">Перетащите IFC-файл сюда или нажмите «Загрузить IFC»</span>
        </div>
      </div>

      <!-- 3D Canvas -->
      <canvas id="three-canvas"></canvas>

      <!-- Drop overlay -->
      <div id="drop-overlay" class="hidden">
        <div class="drop-content">
          <div class="drop-icon">📦</div>
          <div>Отпустите файл для загрузки</div>
        </div>
      </div>

      <!-- Section Box Panel -->
      <div id="section-panel" class="hidden">
        <div class="panel-header">
          <span class="panel-title">✂️ Куб подрезки</span>
          <button id="section-close" class="panel-close-btn" title="Закрыть">✕</button>
        </div>
        <div class="section-body">
          <div class="section-control">
            <div class="control-header">
              <span class="control-label">↕️ Высота (Y)</span>
              <span id="y-val" class="control-val">0% – 100%</span>
            </div>
            <div class="range-dual">
              <div class="range-row">
                <span class="range-sub">Снизу</span>
                <input type="range" id="clip-y-min" min="0" max="100" value="0" step="0.5" />
              </div>
              <div class="range-row">
                <span class="range-sub">Сверху</span>
                <input type="range" id="clip-y-max" min="0" max="100" value="100" step="0.5" />
              </div>
            </div>
          </div>

          <div class="section-control">
            <div class="control-header">
              <span class="control-label">↔️ Длина (X)</span>
              <span id="x-val" class="control-val">0% – 100%</span>
            </div>
            <div class="range-dual">
              <div class="range-row">
                <span class="range-sub">Слева</span>
                <input type="range" id="clip-x-min" min="0" max="100" value="0" step="0.5" />
              </div>
              <div class="range-row">
                <span class="range-sub">Справа</span>
                <input type="range" id="clip-x-max" min="0" max="100" value="100" step="0.5" />
              </div>
            </div>
          </div>

          <div class="section-control">
            <div class="control-header">
              <span class="control-label">↗️ Ширина (Z)</span>
              <span id="z-val" class="control-val">0% – 100%</span>
            </div>
            <div class="range-dual">
              <div class="range-row">
                <span class="range-sub">Спереди</span>
                <input type="range" id="clip-z-min" min="0" max="100" value="0" step="0.5" />
              </div>
              <div class="range-row">
                <span class="range-sub">Сзади</span>
                <input type="range" id="clip-z-max" min="0" max="100" value="100" step="0.5" />
              </div>
            </div>
          </div>

          <div class="section-footer">
            <label class="section-checkbox">
              <input type="checkbox" id="show-box-toggle" checked />
              <span>Показывать куб</span>
            </label>
            <div class="section-btn-group">
              <button id="section-fit-visible" class="section-action-btn" title="Подогнать границы куба строго под видимые конструкции (без площадок)">🎯 Под видимое</button>
              <button id="section-reset" class="section-action-btn">🔄 Сбросить</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Model Tree / Categories Panel -->
      <div id="tree-panel" class="hidden">
        <div class="panel-header">
          <span class="panel-title">🌲 Элементы и видимость</span>
          <button id="tree-close" class="panel-close-btn" title="Закрыть">✕</button>
        </div>
        <div class="tree-toolbar">
          <button id="hide-helpers-btn" class="tree-quick-btn" title="Скрыть геопривязку, поверхности и прокси">🚫 Скрыть поверхности/прокси</button>
          <button id="tree-show-all-btn" class="tree-quick-btn">👁️ Показать всё</button>
        </div>
        <div id="tree-content" class="tree-content"></div>
      </div>

      <!-- Properties panel -->
      <div id="props-panel" class="hidden">
        <div class="props-header">
          <span>Свойства элемента</span>
          <button id="props-close">✕</button>
        </div>
        <div class="props-actions">
          <button id="hide-elem-btn" class="prop-btn" title="Скрыть выбранный элемент">👁️ Скрыть элемент</button>
          <button id="isolate-elem-btn" class="prop-btn" title="Изолировать этот элемент">🎯 Изолировать</button>
        </div>
        <div id="props-content"></div>
      </div>

      <!-- Loading spinner -->
      <div id="loading" class="hidden">
        <div class="spinner"></div>
        <div id="loading-text">Загрузка модели...</div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
